name: Rust

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A hosted runner has no special hardware: tests that need it skip on purpose.
  IMPERIFEX_NO_HARDWARE: "1"

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: No unwrap in production code
        run: cargo clippy --workspace --lib --bins -- -D clippy::unwrap_used
      - name: Tests
        run: cargo test --workspace

  # The portable layers build and pass their tests on Linux; the program builds
  # there and says it has no adapters yet.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (portable layers)
        run: cargo clippy -p imperifex-domain -p imperifex-app -p imperifex-platform --all-targets -- -D warnings
      - name: No unwrap in production code (portable layers)
        run: cargo clippy -p imperifex-domain -p imperifex-app -p imperifex-platform --lib -- -D clippy::unwrap_used
      - name: Tests (portable layers)
        run: cargo test -p imperifex-domain -p imperifex-app -p imperifex-platform
      - name: The program builds
        run: cargo build -p imperifex
