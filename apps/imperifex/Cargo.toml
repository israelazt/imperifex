[package]
name = "imperifex"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# The program: wires the real adapters into the application and prints what it
# returns. No logic. See ARCHITECTURE.md.
[dependencies]
imperifex-domain = { path = "../../crates/imperifex-domain" }
imperifex-platform = { path = "../../crates/imperifex-platform" }
imperifex-app = { path = "../../crates/imperifex-app" }
imperifex-ui = { path = "../../crates/imperifex-ui" }

[target.'cfg(windows)'.dependencies]
winit.workspace = true

# Only for the throwaway probe of the title bar, which paints its window with GDI.
[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }
