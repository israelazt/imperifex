[package]
name = "imperifex-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# The adapters of Imperifex: they implement the domain's ports. Windows code only
# in #[cfg(windows)] modules; decoding of what the system returns is portable.
[dependencies]
imperifex-domain = { path = "../imperifex-domain" }
vte.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
