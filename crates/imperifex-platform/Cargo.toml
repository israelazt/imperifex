[package]
name = "imperifex-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# The adapters of Imperifex: they implement the domain's ports. Windows code only
# in #[cfg(windows)] modules; decoding of what the system returns is portable.
[dependencies]
imperifex-domain = { path = "../imperifex-domain" }
vte.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    # Drawing the window with Direct3D 11 (T-D13).
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    # The letters and icons (T-D14).
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
    "Win32_System_Console",
    # The clipboard, to paste and to copy.
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
] }
# Named by `#[implement]`, for the font fallback of DirectWrite.
windows-core.workspace = true
