[workspace]
resolver = "2"
members = [
    "crates/imperifex-domain",
    "crates/imperifex-platform",
    "crates/imperifex-app",
    "apps/imperifex",
    "crates/imperifex-bench-domain",
    "crates/imperifex-bench-platform",
    "crates/imperifex-bench-app",
    "apps/imperifex-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Every crate follows these (`[lints] workspace = true`). A function over 50 lines (see
# clippy.toml) or too tangled is split, not silenced: design principles of the skill.
# `unsafe` is only for calling the system, and each use is small and explained:
# one operation per block, with its `// SAFETY:` line, also inside an `unsafe fn`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
too_many_lines = "warn"
cognitive_complexity = "warn"
redundant_clone = "warn"
needless_pass_by_value = "warn"

[workspace.dependencies]
windows = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
